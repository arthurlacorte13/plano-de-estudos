<style>
:root{
  /* Layout: barra lateral fixa + área de trabalho em cartões; no celular vira barra inferior */
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e2e6ef; --ink:#17203b; --muted:#66708a;
  --primary:#2b59e6; --primary-ink:#ffffff; --primary-soft:#e7edfd;
  --good:#16936a; --good-soft:#e1f5ec; --warn:#b97a00; --warn-soft:#fcf1d8; --bad:#d23f3f; --bad-soft:#fce6e6;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,70,.05),0 6px 20px rgba(20,30,70,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--primary)}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.brand b{font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--primary-soft);color:var(--primary)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.who label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 4px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--muted);padding:0 4px}

.main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;line-height:0}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.grid{display:grid;gap:16px;margin-bottom:16px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:15px;font-weight:700}
.card-h .sp{flex:1}
.card-h .meta{color:var(--muted);font-size:12.5px}
.tile .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.tile .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.tile .big small{font-size:14px;color:var(--muted);font-weight:600}
.tile .foot{font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.info{background:var(--primary-soft);color:var(--primary)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:700}
.row .t2{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.row .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rank{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* Edital */
.mats{display:grid;gap:14px}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.mat.off{opacity:.62}
.mat.off:hover{opacity:.9}
.plan-tg{color:var(--good)}
.plan-tg.is-off{color:var(--warn)}
.rc-prev{background:var(--primary-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.ciclo-card{margin-bottom:16px}
.ciclo-card h2{display:flex;align-items:center;gap:8px}
.ciclo-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:none}
.ciclo-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ciclo-list li.next{border-color:var(--good);background:var(--good-soft)}
.ciclo-list .grow{flex:1;font-weight:600;min-width:0}
.ciclo-n{width:24px;height:24px;border-radius:7px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.icon-btn[disabled]{opacity:.25;pointer-events:none}
.ciclo-seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ciclo-seq .arrow{color:var(--muted)}
.cg-days{margin-top:8px;display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.cg-days b{color:var(--ink);font-weight:700}
.series{display:grid;gap:8px;max-height:60vh;overflow-y:auto}
.serie{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.serie .grow{flex:1;min-width:0}
.serie .t1{font-weight:700}
.serie .t2{font-size:12.5px;color:var(--muted)}
.serie .t2 b{color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ev-blk.is-rev{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff) 0 8px,color-mix(in srgb,var(--c) 30%,#fff) 8px 16px);border:1.5px dashed color-mix(in srgb,var(--c) 70%,#000)}
.rev-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.85);color:var(--ink);border-radius:4px;padding:1px 6px;margin-bottom:3px}
.rev-flag svg{width:11px;height:11px}
.rev-cada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.rev-cada>span{flex:1 1 220px}
[hidden]{display:none!important}
.bk-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bk-banner span{flex:1 1 280px}
.bk-edit{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--surface-2)}
.bk-edit .pills .btn{padding:3px 9px}
.bk-info{display:grid;gap:4px;margin-bottom:14px}
.bk-acts{display:grid;gap:8px}
.bk-acts svg,.bk-info svg{width:16px;height:16px;flex:none}
.bk-acts .btn{justify-content:flex-start;padding:10px 14px}
.btn.danger-soft{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.btn.danger-soft:hover{background:var(--bad-soft)}
@media (hover:none){.ev-x{display:flex}}
.mat-h{display:grid;grid-template-columns:6px 1fr auto;cursor:pointer}
.mat-h .stripe{background:var(--c)}
.mat-h .body{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center}
.mat-h h3{font-size:15.5px;font-weight:700}
.mat-stats{display:flex;gap:18px;color:var(--muted);font-size:12.5px}
.mat-stats b{display:block;color:var(--ink);font-size:14px}
.mat-act{display:flex;align-items:center;gap:2px;padding-right:10px}
.topics{border-top:1px solid var(--line);padding:6px 16px 14px 22px;background:var(--surface-2)}
.topic{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.topic:last-of-type{border-bottom:0}
.topic .nm{flex:1;min-width:0}
.topic.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:12px;height:12px}
.add-top{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.add-top textarea{flex:1}

/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:220px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.day.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.day.past{opacity:.72}
.day-h{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.day-h .d{font-weight:800;font-size:15px}
.day-h .w{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.day-h .cap{font-size:11.5px;color:var(--muted);margin-top:2px}
.day-b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.blk{border-radius:9px;padding:7px 8px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border-left:3px solid var(--c);font-size:12px;cursor:pointer;position:relative}
.blk:hover{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.blk .h{font-weight:700;display:flex;gap:6px;align-items:center}
.blk .tp{color:var(--muted);overflow-wrap:anywhere}
.blk.done{opacity:.55}
.blk.done .m{text-decoration:line-through}
.blk .x{position:absolute;top:3px;right:3px}
.evt{font-size:11.5px;font-weight:700;border-radius:8px;padding:5px 8px}
.evt.prova{background:var(--bad-soft);color:var(--bad)}
.evt.rev{background:var(--warn-soft);color:var(--warn);cursor:pointer}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs button span{opacity:.7;margin-left:4px}

/* Tabela */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* Provas */
.provas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.prova{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.countdown{width:86px;border-radius:12px;background:var(--primary-soft);color:var(--primary);text-align:center;padding:10px 4px}
.countdown b{display:block;font-size:30px;font-weight:800;line-height:1}
.countdown small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.countdown.past{background:var(--surface-2);color:var(--muted)}
.countdown.soon{background:var(--bad-soft);color:var(--bad)}

/* Forms & modal */
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.f7 .field > span{text-align:center}
.f7 input{text-align:center;padding:8px 4px}
.cbx{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.cbx input{width:16px;height:16px;accent-color:var(--primary)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills label{cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills span{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:13px}
.pills input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.pills input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{cursor:pointer}
.colors input{position:absolute;opacity:0}
.colors span{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.colors input:checked + span{box-shadow:0 0 0 2px var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(10,15,35,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.scrim.on{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;padding:18px 20px 0}
.modal-h h2{font-size:18px;font-weight:800;flex:1}
.modal-b{padding:16px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:0 20px 18px}
.timer{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.timer .clock{font-size:28px;font-weight:800;letter-spacing:.02em;flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

/* Gráficos */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block}
.heat-wrap{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.heat-lbl{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--muted);align-items:center}
.legend{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:10px;justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.prog-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.prog-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-row .bar{margin:0}
.prog-row .pc{text-align:right;color:var(--muted);font-weight:700}

/* Planejamento */
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.soft.danger{background:var(--bad-soft);color:var(--bad)}
.ag-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}
.ag-main{padding:14px}
.ag-head{display:flex;align-items:center;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.ag-head h2{font-size:17px;font-weight:700;color:var(--primary);margin:0 8px 0 6px}
.ag-head .sp{flex:1}
.sel-sm{width:auto;padding:5px 30px 5px 12px;border-radius:8px;font-weight:600;color:var(--primary);border-color:var(--primary)}
.wk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:740px}
.wk-h{text-align:center;padding:8px 4px;font-weight:600;font-size:13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.wk-h:nth-child(7){border-right:0}
.wk-h.today{background:var(--primary);color:var(--primary-ink)}
.wk-c{border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:520px;background:var(--surface)}
.wk-c:nth-child(14){border-right:0}
.wk-c.past{background:var(--surface-2)}
.wk-c.today{background:color-mix(in srgb,var(--primary) 4%,var(--surface))}
.wk-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 2px 0}
.ev{position:relative;border-radius:6px;padding:6px 7px;font-size:11.5px;line-height:1.35;border:1px solid transparent}
.ev[role=button]{cursor:pointer}
.ev-t{font-weight:700;font-size:12px;color:var(--ink);overflow-wrap:break-word;hyphens:auto}
.ev-s{hyphens:auto}
[data-drag-ag]{touch-action:pan-y;user-select:none;-webkit-user-select:none}
[data-drag-ag]:not(.done){cursor:grab}
.dragging{opacity:.3}
.drop-before{box-shadow:0 -4px 0 -1px var(--primary)}
.drop-after{box-shadow:0 4px 0 -1px var(--primary)}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;margin:0;transform:rotate(2deg);box-shadow:0 14px 34px rgba(20,30,70,.25);opacity:.95;cursor:grabbing}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
.drop-on{background:color-mix(in srgb,var(--primary) 10%,var(--surface))!important;box-shadow:inset 0 0 0 2px var(--primary)}
.ev-n{font-weight:600;color:var(--muted);font-size:10.5px}
.ev-s{color:color-mix(in srgb,var(--ink) 70%,transparent);margin-top:3px;overflow-wrap:anywhere}
.ev-meta{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;margin-top:3px;font-size:10.5px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.dur{background:rgba(255,255,255,.75);border-radius:4px;padding:0 5px;font-weight:700;color:var(--ink)}
.ev-blk{background:color-mix(in srgb,var(--c) 34%,#fff);min-height:64px}
.ev-blk:hover{background:color-mix(in srgb,var(--c) 44%,#fff)}
.ev-rev{background:var(--surface-2);border-color:var(--line)}
.ev-rev:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.mchip{display:inline-block;margin-top:3px;max-width:100%;padding:1px 7px;border-radius:4px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:color-mix(in srgb,var(--c) 22%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{background:var(--surface-2);border-color:var(--line);min-height:0}
.ev.done .ev-t,.ev.done .ev-s{color:var(--muted);text-decoration:line-through}
.ev.done .dur{background:var(--surface)}
.ev-more{cursor:pointer;font-weight:700;color:var(--primary);text-align:left;font:inherit;font-size:11.5px;font-weight:700}
.ev-prova{background:var(--bad-soft);color:var(--bad);display:flex;gap:5px;align-items:center;font-weight:600}
.ev-prova svg{width:14px;height:14px;flex:none}
.tag{display:inline-flex;align-items:center;gap:3px;margin-top:5px;border-radius:99px;padding:1px 7px;font-size:10px;font-weight:700}
.tag svg{width:10px;height:10px}
.tag.ok{background:var(--primary-soft);color:var(--primary)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.ev-x{position:absolute;top:2px;right:2px;display:none;background:var(--surface);border-radius:6px;box-shadow:var(--shadow)}
.ev-x .icon-btn{padding:3px}
.ev-x svg{width:12px;height:12px}
.ev:hover .ev-x,.ev:focus-within .ev-x{display:flex}
.mo .mo-c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface)}
.mo .mo-c:nth-child(7n){border-right:0}
.mo .mo-c:hover{background:var(--surface-2)}
.mo .mo-c.out{background:var(--surface-2);color:var(--muted)}
.mo-n{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.mo-c.today .mo-n{background:var(--primary);color:var(--primary-ink)}
.mb{font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;background:color-mix(in srgb,var(--c,#888) 34%,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb.rev{background:var(--surface-2);border:1px solid var(--line)}
.mb.prova{background:var(--bad-soft);color:var(--bad)}
.mb.done{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.mo-more{font-size:10.5px;color:var(--muted);font-weight:600}
.ag-side{padding:14px;position:sticky;top:16px}
.mc-h{display:flex;align-items:center;gap:2px;font-size:12px;margin-bottom:8px}
.mc-h .sp{flex:1}
.mc-r{font-size:11px;color:var(--muted);font-weight:600}
.mc-row{display:grid;grid-template-columns:repeat(7,1fr);border-radius:8px}
.mc-row.sel{background:var(--primary-soft)}
.mc-w span{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding:3px 0}
.mc-d{border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:600;padding:5px 0;border-radius:6px;position:relative;font-variant-numeric:tabular-nums}
.mc-d:hover{background:var(--surface-2)}
.mc-d.out{color:var(--muted);opacity:.55}
.mc-d.today{background:var(--primary);color:var(--primary-ink)}
.mc-d.mark::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--primary)}
.mc-d.today.mark::after{background:var(--primary-ink)}
.layers{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:8px}
.lay-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.layers .cbx{font-size:12.5px;color:var(--primary)}
.ag-tip{margin-top:12px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
@media (max-width:1100px){.ag-layout{grid-template-columns:1fr}.ag-side{position:static;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px}.ag-side .layers{border-top:0;margin-top:0;padding-top:0}}
@media (max-width:600px){.ag-side{grid-template-columns:1fr}}
/* Marca d'água com a paisagem */
.wm{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 55%);mask-image:linear-gradient(to bottom,transparent 0%,#000 55%)}
.wm .scene{position:absolute;inset:0;width:100%;height:100%}
.wm .drift,.wm .ripple{animation:none}
.app{position:relative;z-index:1}
.app.splash ~ .wm{display:none}
body:has(.app.splash) .wm{display:none}
.viewing{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.viewing span{flex:1}
.estude{margin:0 0 24px}
.estude-h{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#3b5363;margin-bottom:8px}
.estude-list{display:flex;flex-wrap:wrap;gap:8px}
.estude-p{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:7px 14px 7px 7px;cursor:pointer;text-align:left;color:#1d2e3a}
.estude-p:hover{background:rgba(255,255,255,.85)}
.estude-p.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.estude-p.pend{opacity:.7}
.estude-p .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.estude-p .nm{display:flex;flex-direction:column;line-height:1.2}
.estude-p small{font-size:11.5px;color:#4b6170}
.estude-hint{font-size:12.5px;color:#3b5363;margin-top:8px}
/* Tela inicial */
.app.splash{grid-template-columns:1fr}
.app.splash .side{display:none}
.app.splash .main{padding:0}
.splash-wrap{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:flex-start;background:#f3e6d6}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.drift{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.ripple{animation:rip 6s ease-in-out infinite alternate}
@keyframes rip{from{transform:translateX(0);opacity:.6}to{transform:translateX(14px);opacity:1}}
.splash-in{position:relative;z-index:1;padding:clamp(28px,8vh,90px) clamp(20px,7vw,110px);max-width:720px;color:#1d2e3a}
.splash-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:clamp(20px,6vh,56px)}
.splash-brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.splash-in h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.frase{font-size:clamp(16px,1.7vw,20px);margin:14px 0 22px;color:#3b5363;max-width:34ch;line-height:1.45}
.splash-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.splash-chips span{background:rgba(255,255,255,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.8);padding:7px 14px;border-radius:99px;font-size:13.5px;color:#2b4150}
.splash-chips b{font-weight:800;color:#1d2e3a}
.splash-act{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{padding:12px 22px;font-size:15px;border-radius:12px;text-decoration:none}
.btn.glass{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.85);color:#1d2e3a;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brand{cursor:pointer;text-decoration:none;color:inherit}
@media (prefers-reduced-motion:reduce){.drift,.ripple{animation:none}}
@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .mat-h .body{grid-template-columns:1fr auto}
  .mat-stats{grid-column:1/-1;order:3}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40}
  .brand,.who{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;text-align:center;position:relative}
  .nav a .badge{position:absolute;top:2px;right:8px}
  .main{padding:16px 16px 100px}
  .mobile-who{display:flex !important}
  .f3{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile .big{font-size:22px}
  .f2,.f3{grid-template-columns:1fr}
  .f7{grid-template-columns:repeat(4,1fr)}
  .mat-h .body{grid-template-columns:1fr}
  .mat-act{padding:0 10px 10px}
  .mat-h{grid-template-columns:6px 1fr}
  .mat-h .mat-act{grid-column:2}
}
.mobile-who{display:none;margin-bottom:14px;align-items:center;gap:8px}
.mobile-who .seg{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function writeErr(e){

let toastT;

/* ---------- cálculos ---------- */
function statsMat(m){
  const ss=mine('sessoes').filter(s=>s.materiaId===m.id);
  const q=sum(ss,s=>s.questoes),a=sum(ss,s=>s.acertos);
  const last=ss.reduce((l,s)=>!l||s.data>l?s.data:l,null);
  const tops=m.topicos||[];const done=tops.filter(t=>t.estudado).length;
  return {min:sum(ss,s=>s.minutos),q,a,rate:q?a/q:null,last,tot:tops.length,done,pct:tops.length?done/tops.length:0,n:ss.length};
}
function provaDe(m){
  const t=today();
  return mine('provas').filter(p=>p.data>=t&&(!p.materiaIds||!p.materiaIds.length||p.materiaIds.includes(m.id))).sort((a,b)=>a.data<b.data?-1:1)[0];
}
function proximaProva(){const t=today();return mine('provas').filter(p=>p.data>=t).sort((a,b)=>a.data<b.data?-1:1)[0];}

/* Sugestão: peso × dificuldade × tempo sem estudar × o que falta do edital × proximidade da prova × desempenho em questões */
function sugestoes(n=3){
  const t=today();
  return mine('materias').filter(m=>m.planejar!==false).map(m=>{
    const st=statsMat(m);
    if(st.tot&&st.done===st.tot)return null;
    const since=st.last?diffDays(st.last,t):null;
    const fSince=since===null?2.2:1+Math.min(since,21)/7;
    const pv=provaDe(m);let fProva=1,dProva=null;
    if(pv){dProva=diffDays(t,pv.data);fProva=1+45/(dProva+15);}
    const fWeak=st.rate===null?1:1+Math.max(-.2,.75-st.rate)*1.5;
    const peso=+m.peso||3,dif=+m.dificuldade||3;
    const score=peso*(.6+dif*.2)*fSince*(1-st.pct*.6)*fProva*fWeak;
    const mot=[];
    if(since===null)mot.push(['Ainda não estudada','info']);
    else if(since>=4)mot.push([`${since} dias sem estudar`,'warn']);
    else if(since===0)mot.push(['Estudada hoje','good']);
    if(st.rate!==null&&st.rate<.7)mot.push([`Acerto de ${Math.round(st.rate*100)}%`,'bad']);
    if(peso>=4)mot.push([`Peso ${peso} no edital`,'info']);
    if(dif>=4)mot.push(['Matéria difícil','']);
    if(dProva!==null&&dProva<=90)mot.push([`Prova em ${dProva} dias`,'warn']);
    if(st.tot)mot.push([`${Math.round(st.pct*100)}% do edital`,'']);
    return {m,st,score,mot,prox:(m.topicos||[]).find(x=>!x.estudado)};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).map((x,_,arr)=>x).reduce((acc,x,i,arr)=>{
    if(i===0){const c=cicloIds();if(c.length){const nx=c[cicloNext('9999',true)];const j=arr.findIndex(y=>y.m.id===nx);if(j>=0){const it=arr[j];it.mot.unshift(['Próxima do ciclo','good']);acc.push(it);}}}
    if(!acc.includes(x))acc.push(x);return acc;},[]).slice(0,n);
}
function revisoesPend(){return mine('revisoes').filter(r=>!r.feita).sort((a,b)=>a.data<b.data?-1:1);}
/* Revisões sugeridas fora do agendamento automático: tópicos vistos há muito tempo ou matérias com acerto baixo */
function revisoesSugeridas(){
  const t=today();const pend=revisoesPend();const out=[];
  mine('materias').forEach(m=>{
    const ss=mine('sessoes').filter(s=>s.materiaId===m.id);
    (m.topicos||[]).filter(tp=>tp.estudado).forEach(tp=>{
      if(pend.some(r=>r.topicoId===tp.id))return;
      const st=ss.filter(s=>s.topicoId===tp.id);
      const last=st.reduce((l,s)=>!l||s.data>l?s.data:l,tp.dataEstudo||null);
      const q=sum(st,s=>s.questoes),a=sum(st,s=>s.acertos);const rate=q?a/q:null;
      const dias=last?diffDays(last,t):null;
      let score=0,why=[];
      if(dias!==null&&dias>=20){score+=dias/10;why.push([`Visto há ${dias} dias`,'warn']);}
      if(rate!==null&&rate<.65){score+=(.8-rate)*10;why.push([`Acerto de ${Math.round(rate*100)}%`,'bad']);}
      if(score>0)out.push({m,tp,score,why});
    });
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,6);
}
function minutosPorDia(){const map={};mine('sessoes').forEach(s=>{map[s.data]=(map[s.data]||0)+(+s.minutos||0);});return map;}
function weekStart(off=0){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+off*7);return ymd(d);}
function streak(map){let n=0,d=today();if(!map[d])d=addDays(d,-1);while(map[d]){n++;d=addDays(d,-1);}return n;}

function barChart(map){
  const t=today();const days=[];for(let i=13;i>=0;i--){const d=addDays(t,-i);days.push([d,(map[d]||0)/60]);}
  const W=560,H=190,pl=30,pb=26,pt=12;const max=Math.max(2,Math.ceil(Math.max(...days.map(d=>d[1]))));
  const step=max<=4?1:max<=8?2:Math.ceil(max/4);const top=Math.ceil(max/step)*step;
  const bw=(W-pl-8)/14;const y=v=>H-pb-(v/top)*(H-pb-pt);
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}h</text>`;}
  const bars=days.map(([d,v],i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;const isT=d===t;const hh=Math.max(v>0?3:0,H-pb-y(v));
    return `<rect x="${x}" y="${H-pb-hh}" width="${w}" height="${hh}" rx="4" fill="var(--primary)" opacity="${isT?1:.55}"><title>${fmtD(d)}: ${fmtMin(v*60)}</title></rect>
    <text x="${x+w/2}" y="${H-8}" text-anchor="middle" ${isT?'style="font-weight:700;fill:var(--ink)"':''}>${parse(d).getDate()}</text>`;}).join('');
  const tot=sum(days,d=>d[1]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas estudadas por dia">${g}${bars}</svg><div class="t2 num" style="margin-top:6px">Total: ${fmtMin(tot*60)} · média ${fmtMin(tot*60/14)} por dia</div>`;
}
function heatmap(map){
  const t=today();const end=addDays(weekStart(),6);const start=addDays(end,-83);
  const vals=[];for(let i=0;i<84;i++){const d=addDays(start,i);vals.push([d,map[d]||0]);}
  const lvl=m=>m<=0?0:m<60?1:m<120?2:m<180?3:4;const op=[0,.25,.5,.75,1];
  const cells=vals.map(([d,m])=>d>t?`<i style="opacity:.35"></i>`:`<i title="${fmtD(d)}: ${fmtMin(m)}" style="${m?`background:var(--good);opacity:${op[lvl(m)]}`:''}"></i>`).join('');
  return `<div class="heat-wrap"><div class="heat-lbl"><span>Seg</span><span></span><span>Qua</span><span></span><span>Sex</span><span></span><span>Dom</span></div><div class="heat">${cells}</div></div>
  <div class="legend">Menos <i style="background:var(--surface-2)"></i>${[1,2,3,4].map(l=>`<i style="background:var(--good);opacity:${op[l]}"></i>`).join('')} Mais (3h+)</div>`;
}

/* Edital */
/* Revisão cadenciada: a cada N aulas novas de uma matéria, o próximo bloco dela vira revisão */
function topicPicker(m){
  const N=+perfil().revCada||0;const fila=(m.topicos||[]).filter(t=>!t.estudado);let i=0;
  const lastRev=mine('sessoes').filter(s=>s.materiaId===m.id&&s.tipo==='revisao').reduce((l,s)=>s.data>l?s.data:l,'');
  let rec=(m.topicos||[]).filter(t=>t.estudado&&(t.dataEstudo||'')>lastRev).map(t=>t.id);
  return ()=>{
    if(N&&rec.length>=N){const r=rec;rec=[];return {topicoId:'',revisao:true,revTopicos:r};}
    const tp=fila[i]||null;if(tp){i++;rec.push(tp.id);}
    return {topicoId:tp?tp.id:'',revisao:false,revTopicos:[]};
  };
}
function revLabel(m,ids){
  const ns=(ids||[]).map(id=>topName(m,id)).filter(Boolean);if(!ns.length)return 'Revisão da matéria';
  const aulas=ns.map(n=>(n.match(/^(Aula [\d.]+)/)||[])[1]).filter(Boolean);
  return aulas.length===ns.length?(aulas.length>1?`${aulas[0]} a ${aulas[aulas.length-1].replace('Aula ','')}`:aulas[0]):(ns.length>3?ns.slice(0,3).join(' · ')+` +${ns.length-3}`:ns.join(' · '));
}
async function aplicarRevisoesAgenda(){
  const t=today();let n=0;
  for(const m of mine('materias')){
    const bs=mine('agenda').filter(a=>a.materiaId===m.id&&!a.concluido&&a.data>=t&&(a.topicoId||a.revisao)).sort((a,b)=>(a.data+a.hora)<(b.data+b.hora)?-1:1);
    if(!bs.length)continue;const pick=topicPicker(m);
    for(const a of bs){const r=pick();if(a.topicoId!==r.topicoId||!!a.revisao!==r.revisao||(a.revTopicos||[]).join()!==r.revTopicos.join()){await save('agenda',{...a,...r});n++;}}
  }
  return n;
}
/* Ciclo de estudos: ordem fixa das matérias, repetida em sequência */
function cicloIds(){return (perfil().ciclo||[]).filter(id=>{const m=matById(id);return m&&m.owner===S.viewId&&m.planejar!==false;});}
async function saveCiclo(arr){
  const cur=S.data.perfis.find(x=>x.owner===S.viewId)||{id:safeId(S.viewId),owner:S.viewId,...DEFAULT_PERFIL};
  await save('perfis',{...clean(cur),ciclo:arr});
}
/* índice da próxima matéria do ciclo, olhando o que veio antes de `antes` (blocos e estudos) */
function cicloNext(antes,soEstudos){
  const c=cicloIds();if(!c.length)return 0;
  const evs=[...(soEstudos?[]:mine('agenda').map(a=>({mat:a.materiaId,k:a.data+' '+(a.hora||'00:00')}))),
    ...mine('sessoes').map(s=>({mat:s.materiaId,k:s.data+' '+String(s.criadoEm||0).padStart(15,'0')}))]
    .filter(e=>c.includes(e.mat)&&e.k<antes).sort((a,b)=>a.k<b.k?-1:1);
  const last=evs[evs.length-1];return last?(c.indexOf(last.mat)+1)%c.length:0;
}
function montarCiclo(o){
  const c=cicloIds();const out=[];const remover=[];if(!c.length)return {out,remover};
  const ag=mine('agenda');
  if(o.substituir)ag.filter(a=>!a.concluido&&c.includes(a.materiaId)&&a.data>=o.inicio&&a.data<=o.fim&&a.data>=today()).forEach(a=>remover.push(a));
  const rem=new Set(remover.map(a=>a.id));
  let idx=cicloNext(o.inicio+' 00:00');const recId='c'+newId();
  const picks={};const pick=id=>(picks[id]=picks[id]||topicPicker(matById(id)))();
  for(let d=o.inicio;d<=o.fim&&out.length<300;d=addDays(d,1)){
    if(d<today()||!o.dias.includes(parse(d).getDay()))continue;
    const [h,mi]=(o.hora||'19:00').split(':').map(Number);let cur=h*60+mi;
    ag.filter(a=>a.data===d&&!rem.has(a.id)&&a.hora).forEach(a=>{const [x,y]=a.hora.split(':').map(Number);const ini=x*60+y,fim=ini+(+a.duracao||0);if(fim>cur&&ini<=cur+5)cur=fim;});
    for(let k=0;k<o.porDia;k++){
      const id=c[idx%c.length];idx++;
      const r=pick(id);
      out.push({id:newId()+out.length,owner:S.viewId,data:d,hora:`${pad(Math.floor(cur/60)%24)}:${pad(cur%60)}`,duracao:o.dur,materiaId:id,...r,concluido:false,ciclo:true,recId});
      cur+=o.dur;
    }
  }
  return {out,remover};
}

  return `<div class="ev ev-rev ${r.feita?'done':''}" ${r.feita?'':`data-act="registrar" data-mat="${esc(r.materiaId)}" data-top="${esc(r.topicoId||'')}" data-rev="${esc(r.id)}" data-tipo="revisao" role="button" tabindex="0" title="Clique para registrar a revisão"`}>
    <div class="ev-t">Revisão${r.etapa?` <span class="ev-n">${r.etapa}d</span>`:''}</div>
    <span class="mchip" style="--c:${esc(m?.cor||'#888')}">${esc(m?.nome||'Matéria')}</span>
    ${r.topicoId?`<div class="ev-s">${esc(topName(m,r.topicoId))}</div>`:''}
    ${late?`<span class="tag bad">Atrasada ${diffDays(r.data,t)}d</span>`:r.feita?`<span class="tag ok">${IC.ok} Revisado</span>`:''}</div>`;
}
function evBlk(x){

    ${x.revisao?`<div class="rev-flag">${IC.revisoes} Revisão</div>`:''}

    <div class="ev-meta"><span class="dur num">${fmtDur(x.duracao)}</span>${x.hora?`<span class="num">${esc(x.hora)}</span>`:''}</div>
    ${x.revisao?`<div class="ev-s">${esc(revLabel(m,x.revTopicos))}</div>`:x.topicoId?`<div class="ev-s">${esc(topName(m,x.topicoId))}</div>`:''}

function evHist(s){
  const m=matById(s.materiaId);
  return `<div class="ev ev-blk done" style="--c:${esc(m?.cor||'#888')}">
    <div class="ev-t">${esc(m?.nome||'Estudo')}</div>
    <div class="ev-meta"><span class="dur num">${fmtDur(s.minutos)}</span>${s.questoes?`<span class="num">${s.acertos}/${s.questoes} q.</span>`:''}</div>
    ${s.topicoId?`<div class="ev-s">${esc(topName(m,s.topicoId))}</div>`:''}
    <span class="tag ok">${IC.ok} ${TIPOS[s.tipo]==='Revisão'?'Revisado':'Estudado'}</span></div>`;
}
function weekGrid(){
  const ws=agWeek();const t=today();const p=perfil();const provas=mine('provas');
  const head=[...Array(7)].map((_,i)=>{const d=addDays(ws,i);const x=parse(d);return `<div class="wk-h ${d===t?'today':''}">${DOW[x.getDay()]}, ${x.getDate()}</div>`;}).join('');
  const cols=[...Array(7)].map((_,i)=>{
    const d=addDays(ws,i);const {revs,blks,hist}=dayItems(d);const dow=parse(d).getDay();
    const used=sum(mine('agenda').filter(x=>x.data===d),x=>x.duracao);const cap=(+p.dispo[dow]||0)*60;
    const pv=provas.filter(x=>x.data===d);
    return `<div class="wk-c ${d<t?'past':''} ${d===t?'today':''}" data-drop-d="${d}">
      ${pv.map(x=>`<div class="ev ev-prova">${IC.provas}<b>Prova</b> ${esc(x.nome)}</div>`).join('')}
      ${revs.slice(0,4).map(evRev).join('')}${revs.length>4?`<button class="ev ev-rev ev-more" data-act="go-rev">+${revs.length-4} revisões</button>`:''}${blks.map(evBlk).join('')}${hist.map(evHist).join('')}
      <div class="wk-foot"><span class="num" title="Planejado / disponível">${fmtDur(used)} de ${fmtDur(cap)}</span><button class="icon-btn" data-act="novo-bloco" data-data="${d}" aria-label="Adicionar bloco em ${fmtD(d)}" title="Adicionar bloco">${IC.plus}</button></div>
    </div>`;}).join('');
  return `<div class="wk-scroll"><div class="wk">${head}${cols}</div></div>`;
}
function monthGrid(){
  const a=parse(S.agAnchor);const first=ymd(new Date(a.getFullYear(),a.getMonth(),1));const start=weekOf(first);const t=today();const mo=a.getMonth();
  const head=DOW.map(d=>`<div class="wk-h">${d}</div>`).join('');
  const cells=[...Array(42)].map((_,i)=>{
    const d=addDays(start,i);const x=parse(d);const {revs,blks,hist}=dayItems(d);
    const pv=mine('provas').filter(p=>p.data===d);
    const all=[...pv.map(p=>`<div class="mb prova">Prova: ${esc(p.nome)}</div>`),
      ...(revs.length?[`<div class="mb rev">${revs.length} ${revs.length===1?'revisão':'revisões'}</div>`]:[]),
      ...blks.map(b=>{const m=matById(b.materiaId);return `<div class="mb ${b.concluido?'done':''}" data-drag-ag="${esc(b.id)}" style="--c:${esc(m?.cor||'#888')}">${b.revisao?'↻ ':''}${esc(m?.nome||'Estudo')}</div>`;}),
      ...hist.map(s=>{const m=matById(s.materiaId);return `<div class="mb done" style="--c:${esc(m?.cor||'#888')}">${esc(m?.nome||'Estudo')}</div>`;})];
    return `<div class="mo-c ${x.getMonth()!==mo?'out':''} ${d===t?'today':''}" data-act="ag-day" data-d="${d}" data-drop-d="${d}" role="button" tabindex="0" aria-label="Ver semana de ${fmtD(d)}">
      <span class="mo-n num">${x.getDate()}</span>${all.slice(0,4).join('')}${all.length>4?`<div class="mo-more">+${all.length-4} mais</div>`:''}</div>`;}).join('');
  return `<div class="wk-scroll"><div class="wk mo">${head}${cells}</div></div>`;
}
function miniCal(){
  const a=parse(S.agAnchor);const mo=a.getMonth();const first=ymd(new Date(a.getFullYear(),mo,1));const start=weekOf(first);
  const ws=agWeek();const t=today();
  const marks=new Set([...mine('agenda').map(x=>x.data),...mine('revisoes').filter(r=>!r.feita).map(r=>r.data),...mine('provas').map(p=>p.data)]);
  const rows=[];for(let w=0;w<6;w++){const rs=addDays(start,w*7);const cells=[...Array(7)].map((_,i)=>{const d=addDays(rs,i);const x=parse(d);
    return `<button class="mc-d ${x.getMonth()!==mo?'out':''} ${d===t?'today':''} ${marks.has(d)?'mark':''}" data-act="ag-day" data-d="${d}" aria-label="${fmtD(d)}">${x.getDate()}</button>`;}).join('');
    rows.push(`<div class="mc-row ${S.agMode==='semana'&&rs===ws?'sel':''}">${cells}</div>`);}
  const range=S.agMode==='semana'?`${fmtD(ws)} – ${fmtD(addDays(ws,6))}`:`${MESES[mo]}`;
  return `<div class="mc-h"><b>${MES[mo].toUpperCase()}.</b><span class="sp"></span><button class="icon-btn" data-act="ag-nav" data-d="-1" aria-label="Anterior">${IC.chevl}</button><span class="num mc-r">${range}</span><button class="icon-btn" data-act="ag-nav" data-d="1" aria-label="Próximo">${IC.chev}</button></div>
  <div class="mc-row mc-w">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>${rows.join('')}`;
}

  const L=S.layers;
  return topBar('Planejamento',`Sua agenda de estudos${viewer()}`,sem?`<button class="btn soft" data-act="recorrencia">${IC.repeat} Recorrências</button><button class="btn soft" data-act="gerar-semana">${IC.spark} Replanejar</button><button class="btn soft danger" data-act="limpar-semana">Remover</button>`:'')+
  `<div class="ag-layout">
    <div class="card ag-main">
      <div class="ag-head">
        <button class="icon-btn" data-act="ag-nav" data-d="-1" aria-label="${sem?'Semana anterior':'Mês anterior'}">${IC.chevl}</button>
        <button class="icon-btn" data-act="ag-nav" data-d="1" aria-label="${sem?'Próxima semana':'Próximo mês'}">${IC.chev}</button>
        <h2>${MESES[ref.getMonth()]}, ${ref.getFullYear()}</h2>

        <span class="sp"></span>
        <select id="ag-mode" aria-label="Visualização" class="sel-sm"><option value="semana" ${sem?'selected':''}>Semanal</option><option value="mes" ${sem?'':'selected'}>Mensal</option></select>
      </div>
      ${sem?weekGrid():monthGrid()}
    </div>
    <aside class="card ag-side">
      ${miniCal()}
      <div class="layers"><div class="lay-h">Minhas agendas</div>
        <label class="cbx"><input type="checkbox" id="lay-rev" ${L.rev?'checked':''}> Revisões</label>
        <label class="cbx"><input type="checkbox" id="lay-hist" ${L.hist?'checked':''}> Histórico</label>
        <label class="cbx"><input type="checkbox" id="lay-plan" ${L.plan?'checked':''}> Planejamento</label>
      </div>
      <div class="ag-tip">Arraste um bloco para outro dia ou para cima/baixo no mesmo dia para mudar a ordem. Clique nele para ver as opções. <b>Replanejar</b> refaz os blocos ainda não feitos da semana conforme as prioridades atuais.</div>
    </aside>
  </div>`;
}

/* Revisões */

  const t=today();const all=mine('revisoes');
  const g={atrasadas:all.filter(r=>!r.feita&&r.data<t),hoje:all.filter(r=>!r.feita&&r.data===t),proximas:all.filter(r=>!r.feita&&r.data>t),feitas:all.filter(r=>r.feita)};
  const sorted=g[S.revTab].sort((a,b)=>S.revTab==='feitas'?((a.feitaEm||'')<(b.feitaEm||'')?1:-1):(a.data<b.data?-1:1)).slice(0,80);
  const sug=revisoesSugeridas();
  const p=perfil();
  return topBar('Revisões',`Ciclo de revisões em ${p.intervalos.join(', ')} dias${viewer()}`)+`
  <div class="grid two">
    <div class="card"><div class="tabs">${[['atrasadas','Atrasadas'],['hoje','Hoje'],['proximas','Próximas'],['feitas','Feitas']].map(([k,l])=>`<button data-act="rev-tab" data-id="${k}" class="${S.revTab===k?'on':''}">${l}<span class="num">${g[k].length}</span></button>`).join('')}</div>
      <div class="list">${sorted.length?sorted.map(revRow).join(''):`<div class="empty"><b>Nenhuma revisão aqui</b>${S.revTab==='hoje'?'Você está em dia.':''}</div>`}</div></div>
    <div class="card"><div class="card-h"><h2>Revisões sugeridas</h2></div>
      <p class="t2" style="margin:-6px 0 10px;color:var(--muted);font-size:12.5px">Tópicos já estudados que estão há muito tempo sem contato ou com acerto baixo nas questões.</p>
      <div class="list">${sug.length?sug.map(s=>`<div class="row"><span class="dot" style="background:${esc(s.m.cor)}"></span><div class="grow"><div class="t1">${esc(s.tp.nome)}</div><div class="t2">${esc(s.m.nome)}</div><div class="chips">${chips(s.why)}</div></div>
        <button class="btn sm" data-act="rev-agendar" data-mat="${esc(s.m.id)}" data-top="${esc(s.tp.id)}">Agendar p/ hoje</button></div>`).join(''):`<div class="empty"><b>Sem sugestões por enquanto</b>Elas aparecem quando um tópico fica mais de 20 dias sem revisão ou o acerto cai abaixo de 65%.</div>`}</div></div>

/* Histórico */
function vHistorico(){
  const mats=mine('materias');
  let ss=mine('sessoes').sort((a,b)=>a.data===b.data?(b.criadoEm||0)-(a.criadoEm||0):(a.data<b.data?1:-1));
  if(S.histMat)ss=ss.filter(s=>s.materiaId===S.histMat);
  const q=sum(ss,s=>s.questoes),a=sum(ss,s=>s.acertos);
  return topBar('Histórico de estudos',`${ss.length} registros · ${fmtMin(sum(ss,s=>s.minutos))} · ${q?Math.round(a/q*100)+'% de acerto em '+q+' questões':'sem questões'}${viewer()}`,
    `<select id="hist-mat" aria-label="Filtrar por matéria" style="width:auto"><option value="">Todas as matérias</option>${mats.map(m=>`<option value="${esc(m.id)}" ${S.histMat===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>`)+
  `<div class="card tbl-wrap">${ss.length?`<table><thead><tr><th>Data</th><th>Matéria / tópico</th><th>Tipo</th><th>Tempo</th><th>Questões</th><th>Anotações</th><th></th></tr></thead><tbody>
  ${ss.slice(0,300).map(s=>{const m=matById(s.materiaId);const r=s.questoes?Math.round(s.acertos/s.questoes*100):null;return `<tr>
    <td class="num">${fmtD(s.data)}</td><td><div style="font-weight:700"><span class="dot" style="background:${esc(m?.cor||'#999')}"></span> ${esc(m?.nome||'—')}</div><div class="t2" style="color:var(--muted)">${esc(topName(m,s.topicoId))}</div></td>
    <td><span class="chip ${s.tipo==='revisao'?'warn':s.tipo==='questoes'?'info':''}">${TIPOS[s.tipo]||s.tipo}</span></td><td class="num">${fmtMin(s.minutos)}</td>
    <td class="num">${s.questoes?`${s.acertos}/${s.questoes} <span class="chip ${r>=75?'good':r>=60?'warn':'bad'}">${r}%</span>`:'—'}</td><td style="max-width:260px;color:var(--muted)">${esc(s.notas||'')}</td>
    <td><button class="icon-btn" data-act="del-sessao" data-id="${esc(s.id)}" aria-label="Excluir registro">${IC.trash}</button></td></tr>`;}).join('')}</tbody></table>`:`<div class="empty"><b>Nenhum estudo registrado</b>Use o botão “Registrar estudo” depois de cada sessão.</div>`}</div>`;

/* ---------- modais ---------- */
let modalCleanup=null;
function openModal(title,body,foot,onMount){
  $('#modal').innerHTML=`<div class="modal-h"><h2>${title}</h2><button class="icon-btn" data-act="close-modal" aria-label="Fechar">${IC.x}</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div>`;
  $('#scrim').classList.add('on');
  if(onMount)modalCleanup=onMount($('#modal'))||null;
  const f=$('#modal input,#modal select,#modal textarea');if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(){if(modalCleanup){modalCleanup();modalCleanup=null;}$('#scrim').classList.remove('on');$('#modal').innerHTML='';}
function confirmBox(msg,onYes,yes='Excluir'){
  openModal('Confirmar',`<p style="margin:0">${msg}</p>`,`<button class="btn" data-act="close-modal">Cancelar</button><button class="btn pri" id="cf-yes" style="background:var(--bad);border-color:var(--bad);color:#fff">${yes}</button>`,
  el=>{$('#cf-yes',el).onclick=async()=>{closeModal();await onYes();};});
}
const val=id=>$('#'+id)?.value?.trim()??'';

function modalRegistrar(o={}){
  const mats=mine('materias');
  if(!mats.length){toast('Cadastre uma matéria no edital antes de registrar estudos.');location.hash='#edital';return;}
  const matId=o.mat&&matById(o.mat)?o.mat:mats[0].id;
  const tipo=o.tipo||'teoria';
  const p=perfil();
  const body=`<form class="form" id="f-reg">
    <div class="timer"><div class="clock num" id="clk">00:00:00</div><button type="button" class="btn" id="clk-go">${IC.play} Iniciar</button><button type="button" class="btn ghost sm" id="clk-reset">Zerar</button></div>
    <div class="f2"><label class="field"><span>Matéria</span><select id="r-mat">${mats.map(m=>`<option value="${esc(m.id)}" ${m.id===matId?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label>
    <label class="field"><span>Tópico</span><select id="r-top"></select></label></div>
    <div class="field"><span>Tipo de estudo</span><div class="pills">${Object.entries(TIPOS).map(([k,l])=>`<label><input type="radio" name="r-tipo" value="${k}" ${k===tipo?'checked':''}><span>${l}</span></label>`).join('')}</div></div>
    <div class="f3"><label class="field"><span>Data</span><input type="date" id="r-data" value="${today()}"></label>
    <label class="field"><span>Tempo (minutos)</span><input type="number" id="r-min" min="0" step="5" placeholder="ex.: 60"></label>
    <div></div></div>
    <div class="f3"><label class="field"><span>Questões feitas</span><input type="number" id="r-q" min="0" placeholder="0"></label>
    <label class="field"><span>Acertos</span><input type="number" id="r-a" min="0" placeholder="0"></label><div></div></div>
    <label class="field"><span>Anotações</span><textarea id="r-notas" rows="2" placeholder="O que ficou de dúvida, páginas do material, link da aula…"></textarea></label>
    <label class="cbx"><input type="checkbox" id="r-done" ${tipo!=='revisao'?'checked':''}> Marcar o tópico como estudado no edital</label>
    <label class="cbx"><input type="checkbox" id="r-rev" ${tipo==='teoria'||tipo==='leitura'?'checked':''}> Agendar revisões em ${p.intervalos.join(', ')} dias</label>
    <div class="t2" id="r-err" style="color:var(--bad);font-size:12.5px"></div>
  </form>`;
  openModal('Registrar estudo',body,`<button class="btn" data-act="close-modal">Cancelar</button><button class="btn pri" id="r-save">Salvar registro</button>`,el=>{
    const fillTop=()=>{const m=matById($('#r-mat').value);const tops=m?.topicos||[];
      $('#r-top').innerHTML=`<option value="">Matéria em geral</option>`+tops.map(t=>`<option value="${esc(t.id)}">${t.estudado?'✓ ':''}${esc(t.nome)}</option>`).join('');
      const pick=o.top&&tops.some(t=>t.id===o.top)?o.top:(tops.find(t=>!t.estudado)?.id||'');$('#r-top').value=pick;o.top=null;};
    fillTop();$('#r-mat').onchange=fillTop;
    $$('input[name=r-tipo]',el).forEach(r=>r.onchange=()=>{const v=r.value;$('#r-rev').checked=v==='teoria'||v==='leitura';$('#r-done').checked=v!=='revisao';});
    let run=false,acc=0,st=0,iv=null;
    const cur=()=>acc+(run?Date.now()-st:0);
    const draw=()=>{const s=Math.floor(cur()/1000);$('#clk').textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;};
    $('#clk-go').onclick=()=>{if(run){acc=cur();run=false;clearInterval(iv);$('#clk-go').innerHTML=IC.play+' Continuar';$('#r-min').value=Math.max(1,Math.round(acc/60000));}
      else{st=Date.now();run=true;iv=setInterval(draw,500);$('#clk-go').innerHTML=IC.pause+' Pausar';}};
    $('#clk-reset').onclick=()=>{acc=0;st=Date.now();draw();};
    $('#r-save').onclick=async()=>{
      let min=+$('#r-min').value;if(!min&&cur()>0)min=Math.max(1,Math.round(cur()/60000));
      const q=+$('#r-q').value||0,a=+$('#r-a').value||0;
      if(!min&&!q){$('#r-err').textContent='Informe o tempo estudado (ou use o cronômetro) ou as questões feitas.';return;}
      if(a>q){$('#r-err').textContent='Os acertos não podem passar do número de questões.';return;}
      const data=$('#r-data').value||today();const matId=$('#r-mat').value,topId=$('#r-top').value;
      const tipo=$('input[name=r-tipo]:checked').value;const doneTop=$('#r-done').checked,agRev=$('#r-rev').checked;
      $('#r-save').disabled=true;
      const owner=S.viewId;
      const sess={id:newId(),owner,agId:o.ag||'',materiaId:matId,topicoId:topId,tipo,data,minutos:min||0,questoes:q,acertos:a,notas:val('r-notas'),criadoEm:Date.now(),por:S.me};
      if(!await save('sessoes',sess)){$('#r-save').disabled=false;return;}
      closeModal();
      if(doneTop&&topId){const m=clean(matById(matId));const tp=m.topicos.find(t=>t.id===topId);if(tp&&!tp.estudado){tp.estudado=true;tp.dataEstudo=data;await save('materias',m);}}
      if(agRev){for(const i of perfil().intervalos){await save('revisoes',{id:newId(),owner,materiaId:matId,topicoId:topId,data:addDays(data,i),etapa:i,feita:false,origem:sess.id});}}
      if(o.rev){const r=S.data.revisoes.find(x=>x.id===o.rev);if(r&&!r.feita)await save('revisoes',{...r,feita:true,feitaEm:data});}
      if(o.ag){const g=S.data.agenda.find(x=>x.id===o.ag);if(g&&!g.concluido)await save('agenda',{...g,concluido:true});}
      toast(`Estudo registrado: ${fmtMin(min)}${q?` · ${a}/${q} questões`:''}${agRev?' · revisões agendadas':''}`);
    };
    return ()=>clearInterval(iv);
  });
}

function series(){
  const g={};mine('agenda').filter(a=>a.recId).forEach(a=>{(g[a.recId]=g[a.recId]||[]).push(a);});
  const t=today();
  return Object.entries(g).map(([id,bs])=>{bs.sort((a,b)=>(a.data+a.hora)<(b.data+b.hora)?-1:1);
    const ciclo=bs.some(b=>b.ciclo);const mats=[...new Set(bs.map(b=>b.materiaId))];
    const dias=[...new Set(bs.map(b=>parse(b.data).getDay()))].sort((a,b)=>((a+6)%7)-((b+6)%7));
    const horas=[...new Set(bs.map(b=>b.hora).filter(Boolean))].sort();
    return {id,bs,ciclo,mats,dias,horas,ini:bs[0].data,fim:bs[bs.length-1].data,
      pend:bs.filter(b=>!b.concluido).length,fut:bs.filter(b=>!b.concluido&&b.data>=t).length,feitos:bs.filter(b=>b.concluido).length,dur:bs[0].duracao};
  }).sort((a,b)=>a.ini<b.ini?1:-1);
}

    <div class="field"><span>Termina</span>
      <div class="f2"><label class="cbx"><input type="radio" name="rc-fim" value="data" checked> Em <input type="date" id="rc-ate" value="${addDays(ini,27)}" style="margin-left:6px;width:auto;min-width:150px"></label>

    <label class="cbx"><input type="checkbox" id="rc-pula" checked> Não repetir em dias que já têm bloco desta matéria</label>
    <div class="rc-prev" id="rc-prev"></div>
    <div class="t2" id="rc-err" style="color:var(--bad);font-size:12.5px"></div></form>`;
  openModal('Bloco recorrente',body,`<button class="btn" data-act="close-modal">Cancelar</button><button class="btn pri" id="rc-save">Criar blocos</button>`,el=>{
    const fill=()=>{const m=matById($('#rc-mat').value);const tops=m?.topicos||[];
      $('#rc-top').innerHTML=`<option value="">Matéria em geral</option>${tops.length?'<option value="__seq">Seguir a ordem dos tópicos não estudados</option>':''}`+tops.map(t=>`<option value="${esc(t.id)}">${t.estudado?'✓ ':''}${esc(t.nome)}</option>`).join('');
      $('#rc-top').value=o.top&&tops.some(t=>t.id===o.top)?o.top:'';o.top=null;calc();};
    const gerar=()=>{
      const m=matById($('#rc-mat').value);const ds=$$('input[name=rc-dia]:checked',el).map(i=>+i.value);
      const iniD=$('#rc-ini').value||today();const modo=$('input[name=rc-fim]:checked').value;
      const ate=$('#rc-ate').value;const n=Math.min(200,Math.max(1,+$('#rc-n').value||1));
      const pula=$('#rc-pula').checked;const top=$('#rc-top').value;
      const pk=m?topicPicker(m):null;
      const ocup=new Set(mine('agenda').filter(a=>a.materiaId===m?.id).map(a=>a.data));
      const out=[];const recId='r'+newId();
      if(!ds.length)return {out,erro:'Escolha pelo menos um dia da semana.'};
      if(modo==='data'&&(!ate||ate<iniD))return {out,erro:'A data final precisa ser depois do início.'};
      for(let d=iniD,i=0;i<800&&out.length<200;i++,d=addDays(d,1)){
        if(modo==='data'&&d>ate)break;if(modo==='n'&&out.length>=n)break;
        if(!ds.includes(parse(d).getDay()))continue;if(pula&&ocup.has(d))continue;
        const r=top==='__seq'?pk():{topicoId:top,revisao:false,revTopicos:[]};
        out.push({id:newId()+out.length,owner:S.viewId,data:d,hora:$('#rc-hora').value||p.horaInicio,duracao:+$('#rc-dur').value||p.bloco,materiaId:m.id,...r,concluido:false,recId});
      }
      return {out,erro:out.length?'':'Nenhum dia corresponde a essa combinação.'};
    };
    const calc=()=>{const {out,erro}=gerar();
      $('#rc-prev').innerHTML=out.length?`Serão criados <b>${out.length} blocos</b> (${fmtMin(sum(out,b=>b.duracao))}), de ${fmtD(out[0].data)} a ${fmtD(out[out.length-1].data)}.${out.length>=200?' Limite de 200 por vez.':''}`:`<span style="color:var(--muted)">${esc(erro)}</span>`;};
    fill();$('#rc-mat').onchange=fill;
    el.addEventListener('input',calc);el.addEventListener('change',calc);
    $$('[data-preset]',el).forEach(b=>b.onclick=()=>{const v=b.dataset.preset.split(',').map(Number);$$('input[name=rc-dia]',el).forEach(i=>i.checked=v.includes(+i.value));calc();});
    $('#rc-save').onclick=async()=>{const {out,erro}=gerar();if(!out.length){$('#rc-err').textContent=erro;return;}
      closeModal();toast(`Criando ${out.length} blocos…`);
      for(const b of out){if(!await save('agenda',b))return;}
      toast(`${out.length} blocos de ${matById(out[0].materiaId)?.nome||'estudo'} adicionados à agenda.`);};
  });
}

function planoSemana(ignore=new Set()){
  const p=perfil();const ws=agWeek();const t=today();
  const sug=sugestoes(99).map(s=>({...s,ptr:0,tops:(s.m.topicos||[]).filter(x=>!x.estudado)}));
  if(!sug.length&&!cicloIds().length)return [];
  const out=[];const ag=mine('agenda').filter(x=>!ignore.has(x.id));
  const cic=cicloIds();let cIdx=0;
  if(cic.length){const first=[...Array(7)].map((_,i)=>addDays(ws,i)).find(d=>d>=t)||t;
    const prev=ag.filter(a=>cic.includes(a.materiaId)&&a.data<first).sort((a,b)=>(a.data+a.hora)<(b.data+b.hora)?-1:1).pop();
    cIdx=prev?(cic.indexOf(prev.materiaId)+1)%cic.length:cicloNext(first+' 00:00',true);}
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);if(d<t)continue;
    const dow=parse(d).getDay();const exist=ag.filter(x=>x.data===d);
    let avail=(+p.dispo[dow]||0)*60-sum(exist,x=>x.duracao);
    let [h,mi]=(p.horaInicio||'19:00').split(':').map(Number);let cur=h*60+mi;
    exist.forEach(x=>{if(x.hora){const [a,b]=x.hora.split(':').map(Number);cur=Math.max(cur,a*60+b+(+x.duracao||0));}});
    let lastMat=null;
    while(avail>=25){
      sug.sort((a,b)=>b.score-a.score);
      let s=sug[0];if(sug.length>1&&s.m.id===lastMat)s=sug[1];
      if(cic.length){const id=cic[cIdx%cic.length];cIdx++;s=sug.find(x=>x.m.id===id)||(()=>{const m=matById(id);const n={m,ptr:0,tops:(m.topicos||[]).filter(x=>!x.estudado),score:0};sug.push(n);return n;})();}
      const dur=Math.min(+p.bloco||60,avail);
      s.pick=s.pick||topicPicker(s.m);const r=s.pick();
      out.push({id:newId(),owner:S.viewId,data:d,hora:`${pad(Math.floor(cur/60)%24)}:${pad(cur%60)}`,duracao:dur,materiaId:s.m.id,...r,concluido:false,auto:true});
      s.score*=.5;lastMat=s.m.id;avail-=dur;cur+=dur+10;
    }
    sug.forEach(s=>s.score*=1.6);
  }
  return out;
}

async function reordenarDia(x,d,idx){
  const toMin=h=>{const [a,b]=(h||'').split(':').map(Number);return isNaN(a)?null:a*60+(b||0);};
  const outros=mine('agenda').filter(a=>a.data===d&&a.id!==x.id).sort((a,b)=>(a.hora||'')<(b.hora||'')?-1:1);
  const antes=[...outros];if(x.data===d)antes.push(x);
  const ini=antes.map(a=>toMin(a.hora)).filter(v=>v!=null);
  let cur=ini.length?Math.min(...ini):(toMin(x.hora)??toMin(perfil().horaInicio)??1140);
  const ordem=[...outros];ordem.splice(Math.min(idx,ordem.length),0,{...x,data:d});
  const oldPos=x.data===d?[...antes].sort((a,b)=>(a.hora||'')<(b.hora||'')?-1:1).findIndex(a=>a.id===x.id):-1;
  if(x.data===d&&oldPos===idx)return;
  for(const a of ordem){const hora=`${pad(Math.floor(cur/60)%24)}:${pad(cur%60)}`;
    if(a.id===x.id||a.hora!==hora||a.data!==d)await save('agenda',{...a,data:d,hora});cur+=(+a.duracao||0);}
  toast(x.data===d?'Ordem do dia atualizada.':`Bloco movido para ${fmtDL(d)}.`);
}

    const under=document.elementFromPoint(e.clientX,e.clientY);const tg=under&&under.closest('[data-drop-d]');
    if(tg!==st.target){st.target&&st.target.classList.remove('drop-on');st.target=tg;tg&&tg.classList.add('drop-on');}

      let i=bs.findIndex(b=>{const r=b.getBoundingClientRect();return e.clientY<r.top+r.height/2;});
      if(i<0)i=bs.length;st.idx=i;
      if(bs.length){st.mark=i<bs.length?bs[i]:bs[bs.length-1];st.mark.classList.add(i<bs.length?'drop-before':'drop-after');}
    }
  },{passive:false});
  document.addEventListener('pointerup',async()=>{
    if(!st)return;
    if(!st.started){st=null;return;}
    const id=st.id,d=st.target&&st.target.dataset.dropD,idx=st.idx;
    S.dragEnded=true;setTimeout(()=>{S.dragEnded=false;},50);
    cleanup();
    const x=S.data.agenda.find(a=>a.id===id);if(!x||!d)return;
    if(idx!=null){await reordenarDia(x,d,idx);return;}
    if(d===x.data)return;
    let hora=x.hora;const outros=mine('agenda').filter(a=>a.data===d&&a.id!==id);
    if(hora&&outros.some(a=>a.hora===hora)){const fim=outros.reduce((mx,a)=>{if(!a.hora)return mx;const [h,m]=a.hora.split(':').map(Number);return Math.max(mx,h*60+m+(+a.duracao||0));},0);hora=`${pad(Math.floor(fim/60)%24)}:${pad(fim%60)}`;}
    await save('agenda',{...x,data:d,hora});
    toast(`Bloco movido para ${fmtDL(d)}${hora!==x.hora?' às '+hora:''}.`);
  });
  document.addEventListener('pointercancel',cleanup);
  window.addEventListener('blur',cleanup);
})();
function route(){const h=location.hash.slice(1);S.route=VIEWS.some(v=>v[0]===h)?h:(h===''||h==='inicio'?'inicio':'painel');render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* ===== Versão independente: dados salvos no navegador (localStorage) ===== */
const LS_KEY='estudos-a-dois:dados',LS_VER=1;
let lsTimer=null;
function lsSalvar(){
  clearTimeout(lsTimer);
  lsTimer=setTimeout(()=>{
    try{localStorage.setItem(LS_KEY,JSON.stringify({app:'estudos',versao:LS_VER,salvoEm:new Date().toISOString(),ultimoBackup:S.ultimoBackup||null,data:S.data}));S.lsErro=false;}
    catch(e){S.lsErro=true;render();}
  },150);
}
function migrar(obj){
  /* Converte backups/dados de versões anteriores para o formato atual */
  if(!obj||typeof obj!=='object')throw new Error('Arquivo inválido');
  const data=obj.data||obj;const v=+obj.versao||1;
  const out={materias:[],provas:[],sessoes:[],revisoes:[],agenda:[],perfis:[]};
  for(const k of Object.keys(out))if(Array.isArray(data[k]))out[k]=data[k].filter(x=>x&&typeof x==='object'&&x.id);
  /* todos os registros pertencem ao usuário deste navegador */
  for(const k of Object.keys(out))out[k].forEach(x=>{x.owner='local';if(k==='perfis')x.id='local';});
  if(out.perfis.length>1)out.perfis=[out.perfis[0]];
  if(v>LS_VER)console.warn('Dados de uma versão mais nova do app');
  return out;
}
function exportarDados(){
  const payload={app:'estudos',versao:LS_VER,exportadoEm:new Date().toISOString(),data:S.data};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-estudos-${today()}.json`;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  S.ultimoBackup=today();lsSalvar();render();toast('Backup baixado. Guarde o arquivo num lugar seguro.');
}
function importarDados(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let novo;try{novo=migrar(JSON.parse(r.result));}catch(e){toast('Não consegui ler esse arquivo. Escolha um backup .json exportado pelo app.');return;}
      const n=novo.materias.length,ss=novo.sessoes.length;
      confirmBox(`Importar este backup com <b>${n} matérias</b> e <b>${ss} estudos registrados</b>? Os dados atuais deste navegador serão substituídos.`,async()=>{
        S.data=novo;lsSalvar();render();toast('Backup importado.');},'Importar');};
    r.readAsText(f);};
  inp.click();
}
async function save(col,obj){
  obj=clean(obj);
  const a=S.data[col];const i=a.findIndex(x=>x.id===obj.id);
  if(i>=0)a[i]=obj;else a.push(obj);
  lsSalvar();render();return true;
}
async function removeDoc(col,id){S.data[col]=S.data[col].filter(x=>x.id!==id);lsSalvar();render();}
async function init(){
  S.mode='local';S.me='local';S.viewId='local';
  let raw=null;try{raw=localStorage.getItem(LS_KEY);}catch(e){S.lsErro=true;}
  if(raw){try{const obj=JSON.parse(raw);S.data=migrar(obj);S.ultimoBackup=obj.ultimoBackup||null;}catch(e){S.banner='Os dados salvos neste navegador estão danificados. Importe um backup nas Preferências.';}}
  if(!S.data.perfis.length)S.data.perfis.push({id:'local',owner:'local',...DEFAULT_PERFIL,criadoEm:Date.now()});
  const nome=S.data.perfis[0].nome;if(nome)S.names.local=nome;
  lsSalvar();route();
}
try{document.getElementById('wm').innerHTML=paisagem();}catch(e){}
init();
</script>
